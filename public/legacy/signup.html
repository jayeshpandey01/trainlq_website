<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - TrainIQ</title>
    <meta name="description" content="Join TrainIQ today to start building, training, and deploying advanced machine learning models with ease." />
    <meta name="keywords" content="TrainIQ Sign Up, Create AutoML Account, Machine Learning Platform, AI Developer Tools" />
    <link rel="icon" type="image/png" href="media/logo.png">
    <link rel="shortcut icon" href="media/logo.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: "Outfit", sans-serif;
            background-color: #000;
            color: #fff;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            border-color: #7c3aed;
            background: rgba(255, 255, 255, 0.08);
            outline: none;
            box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    <!-- Header -->
    <div class="absolute top-8 left-8 flex items-center gap-2">
        <a href="index.html" class="flex items-center gap-2 text-white hover:opacity-70 transition-opacity">
            <img src="media/logo.png" alt="TrainIQ" class="h-8 w-8 object-contain invert brightness-200">
            <span class="font-bold text-xl tracking-tighter">TRAINIQ</span>
        </a>
    </div>

    <!-- Auth Container -->
    <div class="w-full max-w-[440px] glass-card p-10 rounded-[32px] shadow-2xl">
        <h1 class="text-4xl font-bold tracking-tighter text-center mb-2">Join TrainIQ</h1>
        <p class="text-neutral-500 text-center mb-10 text-sm">Experience the future of automated ML.</p>
        
        <!-- Auth Form -->
        <form id="signupForm" class="space-y-4">
            <div>
                <label for="email" class="sr-only">Email address</label>
                <input type="email" id="email" required class="input-field w-full px-5 py-4 rounded-2xl text-[15px] placeholder-neutral-600" placeholder="Email address">
            </div>
            <div>
                <label for="password" class="sr-only">Password</label>
                <input type="password" id="password" required minlength="6" class="input-field w-full px-5 py-4 rounded-2xl text-[15px] placeholder-neutral-600" placeholder="Password (min. 6 characters)">
            </div>
            <button type="submit" class="w-full bg-white hover:bg-neutral-200 text-black font-bold text-[15px] py-4 rounded-2xl transition-all mt-4 transform active:scale-95">Create Account</button>
        </form>

        <p class="text-sm mt-8 text-center text-neutral-400">Already have an account? <a href="login.html" class="text-purple-400 hover:text-purple-300 transition-colors">Log in</a></p>

        <div class="relative flex items-center py-8">
            <div class="flex-grow border-t border-white/10"></div>
            <span class="flex-shrink-0 mx-4 text-[10px] font-bold text-neutral-600 uppercase tracking-widest">OR</span>
            <div class="flex-grow border-t border-white/10"></div>
        </div>

        <!-- Single Sign-On Providers -->
        <div class="space-y-3">
            <button id="googleBtn" class="w-full flex items-center justify-center gap-3 px-5 py-4 glass-card rounded-2xl hover:bg-white/5 transition-all group">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                <span class="text-[15px] font-bold text-white group-hover:text-neutral-200">Continue with Google</span>
            </button>
        </div>
        
        <!-- Error Display -->
        <div id="authError" class="mt-6 text-center text-red-400 text-xs hidden font-medium px-4"></div>
    </div>

    <!-- Firebase Authentication Logic -->
    <script type="module">
        import { auth } from "./js/auth.js";
        import { createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const errorDiv = document.getElementById('authError');
        const submitBtn = document.querySelector('#signupForm button[type="submit"]');
        const originalBtnText = submitBtn.textContent;

        function showError(error) {
            const messages = {
                'auth/email-already-in-use': 'Email already exists.',
                'auth/invalid-email': 'Invalid email address.',
                'auth/weak-password': 'Password too weak.',
            };
            errorDiv.textContent = messages[error.code] || `Error: ${error.code}`;
            errorDiv.classList.remove('hidden');
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';
            
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                window.location.replace("dashboard.html");
            } catch (error) {
                showError(error);
                submitBtn.disabled = false;
                submitBtn.textContent = originalBtnText;
            }
        });

        document.getElementById('googleBtn').addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                window.location.replace("index.html");
            } catch (error) {
                showError(error);
            }
        });
    </script>
</body>
</html>
