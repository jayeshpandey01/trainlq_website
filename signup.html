<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - TrainIQ</title>
    <link rel="icon" type="image/png" href="media/logo.png">
    <link rel="shortcut icon" href="media/logo.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="js/page-transition.js"></script>
    <style>
        body { font-family: "Onest", sans-serif; }
    </style>
</head>
<body class="bg-[#ffffff] text-[#000000] min-h-screen flex flex-col items-center justify-center font-['Onest']">
    <div class="absolute top-6 left-6 flex items-center gap-2">
        <a href="index.html" class="text-xl font-bold tracking-tight text-black hover:opacity-70 transition-opacity flex items-center gap-2">
            <img src="media/logo.png" alt="TrainIQ" class="h-7 w-7" style="mix-blend-mode: multiply;">
            TrainIQ
        </a>
    </div>

    <!-- Auth Container -->
    <div class="w-full max-w-[400px] px-8 mt-12">
        <h1 class="text-[32px] font-bold tracking-tight text-center mb-10">Create your account</h1>
        
        <!-- Auth Form -->
        <form id="signupForm" class="space-y-4">
            <div>
                <label for="email" class="sr-only">Email address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-lg border border-neutral-300 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 text-[15px] placeholder-neutral-500 transition-colors" placeholder="Email address">
            </div>
            <div>
                <label for="password" class="sr-only">Password</label>
                <input type="password" id="password" required minlength="6" class="w-full px-4 py-3 rounded-lg border border-neutral-300 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 text-[15px] placeholder-neutral-500 transition-colors" placeholder="Password (min. 6 characters)">
            </div>
            <button type="submit" class="w-full bg-[#10a37f] hover:bg-[#0e906f] text-white font-medium text-[15px] py-3 rounded-lg transition-colors mt-2">Continue</button>
        </form>

        <p class="text-sm mt-4 text-center">Already have an account? <a href="login.html" class="text-[#10a37f] hover:underline">Log in</a></p>

        <div class="relative flex items-center py-6">
            <div class="flex-grow border-t border-neutral-200"></div>
            <span class="flex-shrink-0 mx-4 text-xs font-medium text-neutral-500 uppercase tracking-widest">OR</span>
            <div class="flex-grow border-t border-neutral-200"></div>
        </div>

        <!-- Single Sign-On Providers -->
        <div class="space-y-3">
            <button id="googleBtn" class="w-full flex items-center justify-center gap-3 px-4 py-3 border border-neutral-300 rounded-lg hover:bg-neutral-50 transition-colors">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                <span class="text-[15px] font-medium text-neutral-700">Continue with Google</span>
            </button>

        </div>
        
        <!-- Error Display -->
        <div id="authError" class="mt-4 text-center text-red-500 text-sm hidden font-medium"></div>
    </div>

    <!-- File Protocol Warning -->
    <div id="fileProtocolWarning" class="hidden fixed bottom-0 left-0 right-0 bg-amber-50 border-t-2 border-amber-400 p-4 z-50">
        <div class="max-w-md mx-auto text-center">
            <p class="text-amber-800 text-sm font-semibold mb-1">Firebase Auth requires a local server</p>
            <p class="text-amber-700 text-xs mb-2">You're opening this file directly. Run this command in your project folder:</p>
            <code class="bg-amber-100 text-amber-900 px-3 py-1 rounded text-xs font-mono block">python -m http.server 8080</code>
            <p class="text-amber-600 text-[10px] mt-2">Then open <strong>http://localhost:8080/signup.html</strong></p>
        </div>
    </div>
    <script>
        if (window.location.protocol === 'file:') {
            document.getElementById('fileProtocolWarning').classList.remove('hidden');
        }
    </script>

    <!-- Firebase Authentication Logic -->
    <script type="module">
        import { auth } from "./js/auth.js";
        import { createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const errorDiv = document.getElementById('authError');
        const submitBtn = document.querySelector('#signupForm button[type="submit"]');
        const originalBtnText = submitBtn.textContent;

        // Friendly error message mapping
        function getFriendlyError(errorCode) {
            const messages = {
                'auth/email-already-in-use': 'This email is already registered. Try logging in instead.',
                'auth/invalid-email': 'Please enter a valid email address.',
                'auth/weak-password': 'Password must be at least 6 characters long.',
                'auth/operation-not-allowed': 'Email/Password sign-up is not enabled. Please enable it in the Firebase Console under Authentication > Sign-in method.',
                'auth/too-many-requests': 'Too many attempts. Please try again later.',
                'auth/network-request-failed': 'Network error. Please check your internet connection.',
                'auth/popup-closed-by-user': 'Sign-in popup was closed. Please try again.',
                'auth/cancelled-popup-request': 'Only one popup request is allowed at a time.',
                'auth/popup-blocked': 'Sign-in popup was blocked by your browser. Please allow popups for this site.',
                'auth/configuration-not-found': 'Email/Password sign-in is not enabled. Go to Firebase Console → Authentication → Sign-in method → Enable Email/Password.'
            };
            return messages[errorCode] || `Authentication error: ${errorCode}`;
        }

        function showError(error) {
            console.error('Firebase Auth Error:', error.code, error.message);
            errorDiv.textContent = getFriendlyError(error.code);
            errorDiv.classList.remove('hidden');
        }

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            submitBtn.textContent = isLoading ? 'Creating account...' : originalBtnText;
            submitBtn.style.opacity = isLoading ? '0.7' : '1';
        }

        // Email / Password Registration
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (password.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters long.';
                errorDiv.classList.remove('hidden');
                return;
            }

            setLoading(true);
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                window.location.replace("dashboard.html");
            } catch (error) {
                showError(error);
                setLoading(false);
            }
        });

        // Google Sign In
        document.getElementById('googleBtn').addEventListener('click', async () => {
            errorDiv.classList.add('hidden');
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                window.location.replace("index.html");
            } catch (error) {
                showError(error);
            }
        });
    </script>
</body>
</html>
