<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - TrainIQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="js/page-transition.js"></script>
    <style>
        body { font-family: "Onest", sans-serif; }
    </style>
</head>
<body class="bg-[#ffffff] text-[#000000] min-h-screen flex flex-col items-center justify-center font-['Onest']">
    <div class="absolute top-6 left-6 flex items-center gap-2">
        <a href="index.html" class="text-xl font-bold tracking-tight text-black hover:opacity-70 transition-opacity flex items-center gap-2">
            TrainIQ
            <div class="w-4 h-4 border border-black rounded-[4px]"></div>
        </a>
    </div>

    <!-- Auth Container -->
    <div class="w-full max-w-[400px] px-8 mt-12">
        <h1 class="text-[32px] font-bold tracking-tight text-center mb-10">Welcome back</h1>
        
        <!-- Auth Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label for="email" class="sr-only">Email address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-lg border border-neutral-300 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 text-[15px] placeholder-neutral-500 transition-colors" placeholder="Email address">
            </div>
            <div>
                <label for="password" class="sr-only">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-lg border border-neutral-300 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 text-[15px] placeholder-neutral-500 transition-colors" placeholder="Password">
            </div>
            <button type="submit" class="w-full bg-[#10a37f] hover:bg-[#0e906f] text-white font-medium text-[15px] py-3 rounded-lg transition-colors mt-2">Continue</button>
        </form>

        <p class="text-sm mt-4 text-center">Don't have an account? <a href="signup.html" class="text-[#10a37f] hover:underline">Sign up</a></p>

        <div class="relative flex items-center py-6">
            <div class="flex-grow border-t border-neutral-200"></div>
            <span class="flex-shrink-0 mx-4 text-xs font-medium text-neutral-500 uppercase tracking-widest">OR</span>
            <div class="flex-grow border-t border-neutral-200"></div>
        </div>

        <!-- Single Sign-On Providers -->
        <div class="space-y-3">
            <button id="googleBtn" class="w-full flex items-center justify-center gap-3 px-4 py-3 border border-neutral-300 rounded-lg hover:bg-neutral-50 transition-colors">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                <span class="text-[15px] font-medium text-neutral-700">Continue with Google</span>
            </button>
            <button id="githubBtn" class="w-full flex items-center justify-center gap-3 px-4 py-3 border border-neutral-300 rounded-lg hover:bg-neutral-50 transition-colors">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
                </svg>
                <span class="text-[15px] font-medium text-neutral-700">Continue with GitHub</span>
            </button>
        </div>
        
        <!-- Error Display -->
        <div id="authError" class="mt-4 text-center text-red-500 text-sm hidden font-medium"></div>
    </div>

    <!-- Firebase Authentication Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, GithubAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        // ==========================================
        // TO DO: Replace with your Firebase Config
        // ==========================================
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyCOpxVZ68e8H3_wA5E59mEvizaunIe3-1Q",
            authDomain: "trainlq.firebaseapp.com",
            projectId: "trainlq",
            storageBucket: "trainlq.firebasestorage.app",
            messagingSenderId: "1031179454445",
            appId: "1:1031179454445:web:a5013a5b19e70dea8709e4",
            measurementId: "G-EWFWYW20QL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const errorDiv = document.getElementById('authError');

        // Email / Password Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (firebaseConfig.apiKey === "YOUR_API_KEY_HERE") {
                errorDiv.textContent = "Please add your Firebase config to the script to test login.";
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                // Redirect user to their dashboard or home
                window.location.href = "index.html"; 
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
            }
        });

        // Google Sign In
        document.getElementById('googleBtn').addEventListener('click', async () => {
            if (firebaseConfig.apiKey === "YOUR_API_KEY_HERE") {
                errorDiv.textContent = "Please add your Firebase config to the script to test Google Auth.";
                errorDiv.classList.remove('hidden');
                return;
            }

            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                window.location.href = "index.html";
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
            }
        });
        
        // GitHub Sign In
        document.getElementById('githubBtn').addEventListener('click', async () => {
             if (firebaseConfig.apiKey === "YOUR_API_KEY_HERE") {
                errorDiv.textContent = "Please add your Firebase config to the script to test GitHub Auth.";
                errorDiv.classList.remove('hidden');
                return;
            }

            const provider = new GithubAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                window.location.href = "index.html";
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
